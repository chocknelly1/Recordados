name: Build Antepasados APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto Android v5
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname 'Antepasados_Proyecto_Android_v5_Amor_Esperanza.zip' -print -quit)"
          if [ -z "$ZIP" ]; then echo "No se encontró el ZIP de la versión 5 en la raíz del repositorio"; ls -la; exit 1; fi
          mkdir -p source
          unzip -q "$ZIP" -d source
          ROOT="$(find source -type f -name settings.gradle -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          test -f "$ROOT/app/build.gradle"
          cp "$ROOT/settings.gradle" .
          cp "$ROOT/build.gradle" .
          cp "$ROOT/gradle.properties" .
          cp -R "$ROOT/app" .

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then echo "No se encontró cmdline-tools en $SDK_ROOT"; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Antepasados-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
