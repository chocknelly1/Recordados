name: Build Antepasados APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Android project ZIP if needed
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -f settings.gradle && -d app ]]; then
            echo "Android project files are already at repository root."
          else
            ZIP="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit || true)"
            if [[ -z "$ZIP" ]]; then
              echo "ERROR: No Android project at repository root and no ZIP archive found."
              find . -maxdepth 3 -type f -print
              exit 1
            fi
            echo "Extracting archive: $ZIP"
            mkdir -p _unpacked
            unzip -q "$ZIP" -d _unpacked
            ROOT="$(find _unpacked -type f -name settings.gradle -print -quit | xargs -r dirname)"
            if [[ -z "$ROOT" || ! -f "$ROOT/app/build.gradle" ]]; then
              echo "ERROR: ZIP does not contain settings.gradle and app/build.gradle."
              find _unpacked -maxdepth 5 -type f -print
              exit 1
            fi
            cp "$ROOT/settings.gradle" .
            cp "$ROOT/build.gradle" .
            cp "$ROOT/gradle.properties" .
            cp -R "$ROOT/app" .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "ERROR: No se encontró el Android SDK en $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true


      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antepasados-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
